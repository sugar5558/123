name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          mkdir -p Payload/KFD_H5_Loader.app

          # 创建 Info.plist
          cat > Payload/KFD_H5_Loader.app/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>KFD_H5_Loader</string>
              <key>CFBundleIdentifier</key>
              <string>com.kfd.h5loader</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>KFD_H5_Loader</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLIST

          # 创建 index.html（独立 H5 页面）
          cat > index.html <<HTML
          <!DOCTYPE html>
          <html>
          <head>
              <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
              <style>
                  * { margin:0; padding:0; box-sizing:border-box; }
                  body {
                      background: #0a0a1a;
                      color: #00ffcc;
                      font-family: 'Courier New', monospace;
                      padding: 16px;
                      min-height: 100vh;
                  }
                  .title {
                      text-align: center;
                      font-size: 24px;
                      font-weight: bold;
                      color: #00ffff;
                      padding: 20px 0 10px;
                      text-shadow: 0 0 20px rgba(0,255,255,0.3);
                  }
                  .subtitle {
                      text-align: center;
                      font-size: 12px;
                      color: rgba(0,255,255,0.4);
                      margin-bottom: 20px;
                  }
                  .input-group {
                      display: flex;
                      gap: 10px;
                      margin-bottom: 12px;
                  }
                  .input-group input {
                      flex: 1;
                      padding: 12px 16px;
                      border-radius: 12px;
                      border: 1px solid rgba(0,255,255,0.2);
                      background: rgba(255,255,255,0.05);
                      color: #fff;
                      font-size: 14px;
                      font-family: 'Courier New', monospace;
                      outline: none;
                  }
                  .input-group input:focus {
                      border-color: rgba(0,255,255,0.6);
                  }
                  .btn {
                      padding: 12px 20px;
                      border: 1px solid rgba(0,255,255,0.3);
                      border-radius: 12px;
                      background: rgba(0,255,255,0.08);
                      color: #00ffff;
                      font-size: 14px;
                      font-family: 'Courier New', monospace;
                      cursor: pointer;
                      transition: all 0.3s;
                      text-align: center;
                      touch-action: manipulation;
                  }
                  .btn:active {
                      transform: scale(0.95);
                      background: rgba(0,255,255,0.2);
                  }
                  .btn-primary {
                      background: rgba(0,255,255,0.15);
                      border-color: rgba(0,255,255,0.5);
                  }
                  .btn-danger {
                      border-color: rgba(255,68,100,0.4);
                      color: #ff4466;
                      background: rgba(255,68,100,0.08);
                  }
                  .btn-danger:active {
                      background: rgba(255,68,100,0.2);
                  }
                  .btn-success {
                      border-color: rgba(68,255,136,0.4);
                      color: #44ff88;
                      background: rgba(68,255,136,0.08);
                  }
                  .btn-success:active {
                      background: rgba(68,255,136,0.2);
                  }
                  .btn-block {
                      display: block;
                      width: 100%;
                      margin-bottom: 10px;
                  }
                  .status {
                      padding: 12px 16px;
                      border-radius: 12px;
                      background: rgba(255,255,255,0.03);
                      border: 1px solid rgba(255,255,255,0.06);
                      margin-bottom: 12px;
                      font-size: 12px;
                      color: rgba(255,255,255,0.6);
                      min-height: 20px;
                      word-break: break-all;
                  }
                  .status .highlight { color: #00ffff; }
                  .log {
                      padding: 12px 16px;
                      border-radius: 12px;
                      background: rgba(0,0,0,0.4);
                      border: 1px solid rgba(255,255,255,0.06);
                      min-height: 120px;
                      max-height: 200px;
                      overflow-y: auto;
                      font-size: 11px;
                      color: rgba(0,255,200,0.6);
                      line-height: 1.6;
                      white-space: pre-wrap;
                      font-family: 'Courier New', monospace;
                  }
                  .log .log-success { color: #44ff88; }
                  .log .log-error { color: #ff4466; }
                  .log .log-info { color: #00ffff; }
                  .row { display: flex; gap: 10px; margin-bottom: 10px; }
                  .row .btn { flex: 1; }
                  .footer {
                      text-align: center;
                      margin-top: 16px;
                      font-size: 10px;
                      color: rgba(255,255,255,0.15);
                  }
              </style>
          </head>
          <body>
              <div class='title'>KFD · H5 执行器</div>
              <div class='subtitle'>基于 task_for_pid</div>

              <div class='input-group'>
                  <input id='procInput' placeholder='进程名 (如 cf)' value='cf'>
                  <button class='btn btn-primary' onclick='selectProcess()'>选择</button>
              </div>

              <div class='status' id='status'>● 状态: 等待选择进程</div>

              <div class='row'>
                  <button class='btn btn-success' onclick='runLoop()'>▶ 蔡徐坤</button>
                  <button class='btn' onclick='run2048()'>2048</button>
              </div>

              <div class='row'>
                  <button class='btn btn-danger' onclick='stopLoop()'>⏹ 停止循环</button>
                  <button class='btn' onclick='clearLog()'>清空</button>
              </div>

              <div class='log' id='log'>[系统] 就绪</div>
              <div class='footer'>⚡ 内核读写  |  支持 JavaScript 脚本</div>

              <script>
                  let currentBase = 0;
                  let currentPid = 0;
                  let loopTimer = null;
                  let targetAddr = 0;

                  function log(msg, type) {
                      const el = document.getElementById('log');
                      const cls = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : 'log-info';
                      const time = new Date().toLocaleTimeString();
                      el.innerHTML = `[\${time}] <span class="\${cls}">\${msg}</span>\n` + el.innerHTML;
                      if (el.scrollTop < 20) el.scrollTop = 0;
                  }

                  function clearLog() {
                      document.getElementById('log').innerHTML = '';
                      log('日志已清空');
                  }

                  function setStatus(text, color) {
                      const el = document.getElementById('status');
                      el.innerHTML = text;
                      el.style.color = color || 'rgba(255,255,255,0.6)';
                  }

                  // ---------- 桥接调用 ----------
                  function callBridge(method, args, callback) {
                      const msg = { method: method, args: args || [] };
                      window.webkit.messageHandlers.kfdBridge.postMessage(msg);
                      window._bridgeCallback = callback;
                  }

                  // 同步调用（用于指针链）
                  function callBridgeSync(method, args) {
                      let result = null;
                      let done = false;
                      window._bridgeCallback = function(r) { result = r; done = true; };
                      window.webkit.messageHandlers.kfdBridge.postMessage({ method: method, args: args || [] });
                      const start = Date.now();
                      while (!done && (Date.now() - start) < 5000) { /* wait */ }
                      return result;
                  }

                  window.receiveBridgeResult = function(result) {
                      if (window._bridgeCallback) {
                          window._bridgeCallback(result);
                          window._bridgeCallback = null;
                      }
                  };

                  // ---------- 选择进程 ----------
                  function selectProcess() {
                      const name = document.getElementById('procInput').value.trim();
                      if (!name) { log('请输入进程名', 'error'); return; }
                      log(`🔍 查找进程: ${name}...`);

                      callBridge('getPidByName', [name], function(pid) {
                          if (!pid || pid === 0) {
                              log(`❌ 未找到进程: ${name}`, 'error');
                              setStatus(`✖ 未找到 ${name}`, '#ff4466');
                              return;
                          }
                          log(`✅ 找到进程: ${name} (PID: ${pid})`, 'success');
                          callBridge('getBaseByPid', [pid], function(base) {
                              if (!base || base === 0) {
                                  log('❌ 获取基址失败', 'error');
                                  setStatus('✖ 基址获取失败', '#ff4466');
                                  return;
                              }
                              currentBase = base;
                              currentPid = pid;
                              log(`📍 基址: 0x${base.toString(16).toUpperCase()}`, 'success');
                              setStatus(`● 目标: ${name} (PID: ${pid}) 基址: 0x${base.toString(16).toUpperCase()}`, '#44ff88');
                          });
                      });
                  }

                  // ---------- 蔡徐坤 ----------
                  function runLoop() {
                      if (!currentBase) { log('⚠️ 请先选择进程', 'error'); return; }
                      if (loopTimer) { log('⚠️ 循环已在运行', 'error'); return; }

                      log('🔍 计算指针链: cf+0xC004BD0+0xA0+0x1B0+0x220');
                      const offsets = [0xC004BD0, 0xA0, 0x1B0, 0x220];
                      let addr = currentBase;
                      for (let i = 0; i < offsets.length; i++) {
                          addr = addr + offsets[i];
                          if (i < offsets.length - 1) {
                              const v = callBridgeSync('read64', [addr]);
                              if (!v || v === 0) {
                                  log(`❌ 指针链断裂 [${i+1}]`, 'error');
                                  return;
                              }
                              log(`📖 [${i+1}] 0x${addr.toString(16).toUpperCase()} = 0x${v.toString(16).toUpperCase()}`);
                              addr = v;
                          }
                      }
                      targetAddr = addr;
                      log(`🎯 目标地址: 0x${addr.toString(16).toUpperCase()}`, 'success');
                      log('▶ 开始循环写入 F32 20');

                      loopTimer = setInterval(function() {
                          callBridge('writeFloat', [targetAddr, 20]);
                      }, 10);

                      setStatus('● 状态: 运行中 (F32 20)', '#00ffff');
                  }

                  // ---------- 2048 ----------
                  function run2048() {
                      if (!currentBase) { log('⚠️ 请先选择进程', 'error'); return; }

                      log('🔍 计算 2048 指针链: cf+0xBB8FAC8+0x38+0x8+0x0+0x444');
                      const offsets = [0xBB8FAC8, 0x38, 0x8, 0x0, 0x444];
                      let addr = currentBase;
                      for (let i = 0; i < offsets.length; i++) {
                          addr = addr + offsets[i];
                          if (i < offsets.length - 1) {
                              const v = callBridgeSync('read64', [addr]);
                              if (!v || v === 0) {
                                  log(`❌ 指针链断裂 [${i+1}]`, 'error');
                                  return;
                              }
                              log(`📖 [${i+1}] 0x${addr.toString(16).toUpperCase()} = 0x${v.toString(16).toUpperCase()}`);
                              addr = v;
                          }
                      }
                      targetAddr = addr;
                      log(`🎯 目标地址: 0x${addr.toString(16).toUpperCase()}`, 'success');
                      callBridge('write32', [addr, 108800]);
                      log('✅ 2048 写入成功! (I32 108800)', 'success');
                      setStatus('✓ 2048 写入成功!', '#44ff88');
                  }

                  // ---------- 停止循环 ----------
                  function stopLoop() {
                      if (loopTimer) {
                          clearInterval(loopTimer);
                          loopTimer = null;
                          log('⏹ 循环已停止', 'info');
                          setStatus('● 状态: 已停止', '#ffaa44');
                      } else {
                          log('⚠️ 没有正在运行的循环', 'error');
                      }
                  }

                  log('✅ 就绪 | 输入进程名后点击「选择」');
              </script>
          </body>
          </html>
          HTML

          # 创建 main.m（加载本地 index.html）
          cat > main.m <<MAIN
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <mach/mach.h>
          #import <mach/vm_map.h>
          #import <sys/sysctl.h>

          // ============================================================
          // 基础内核读写（使用 task_for_pid + vm_read_overwrite）
          // ============================================================

          static mach_port_t tfp0 = MACH_PORT_NULL;

          static mach_port_t get_tfp0() {
              if (tfp0 != MACH_PORT_NULL) return tfp0;
              task_for_pid(mach_task_self(), 0, &tfp0);
              return tfp0;
          }

          static uint64_t kread64(uint64_t addr) {
              mach_port_t port = get_tfp0();
              if (port == MACH_PORT_NULL) return 0;
              uint64_t v = 0;
              vm_read_overwrite(port, addr, 8, (vm_address_t)&v, NULL);
              return v;
          }

          static uint32_t kread32(uint64_t addr) {
              mach_port_t port = get_tfp0();
              if (port == MACH_PORT_NULL) return 0;
              uint32_t v = 0;
              vm_read_overwrite(port, addr, 4, (vm_address_t)&v, NULL);
              return v;
          }

          static void kwrite32(uint64_t addr, uint32_t v) {
              mach_port_t port = get_tfp0();
              if (port == MACH_PORT_NULL) return;
              vm_write(port, addr, (vm_address_t)&v, 4);
          }

          static void kwrite_float(uint64_t addr, float v) {
              uint32_t val = *(uint32_t*)&v;
              kwrite32(addr, val);
          }

          // ============================================================
          // 获取进程列表（sysctl）
          // ============================================================
          static NSArray<NSDictionary *> *get_process_list() {
              NSMutableArray *list = [NSMutableArray array];
              int mib[4] = {CTL_KERN, KERN_PROC, KERN_PROC_ALL, 0};
              size_t size = 0;
              sysctl(mib, 3, NULL, &size, NULL, 0);
              struct kinfo_proc *procs = malloc(size);
              if (!procs) return list;
              sysctl(mib, 3, procs, &size, NULL, 0);

              for (int i = 0; i < size / sizeof(struct kinfo_proc); i++) {
                  char *name = procs[i].kp_proc.p_comm;
                  int pid = procs[i].kp_proc.p_pid;
                  if (pid == 0 || pid == getpid()) continue;
                  if (strlen(name) > 0) {
                      [list addObject:@{
                          @"name": [NSString stringWithUTF8String:name],
                          @"pid": @(pid)
                      }];
                  }
              }
              free(procs);
              [list sortUsingComparator:^NSComparisonResult(NSDictionary *a, NSDictionary *b) {
                  return [a[@"name"] compare:b[@"name"]];
              }];
              return list;
          }

          // ============================================================
          // 通过 PID 获取进程基址（vm_region 遍历）
          // ============================================================
          static uint64_t get_base_by_pid(int pid) {
              task_t task;
              kern_return_t kr = task_for_pid(mach_task_self(), pid, &task);
              if (kr != KERN_SUCCESS || task == MACH_PORT_NULL) return 0;

              struct vm_region_submap_info_64 info;
              mach_msg_type_number_t count = VM_REGION_SUBMAP_INFO_COUNT_64;
              vm_address_t addr = 0;
              vm_size_t size = 0;
              natural_t depth = 0;

              while (1) {
                  kr = vm_region_recurse_64(task, &addr, &size, &depth, (vm_region_info_64_t)&info, &count);
                  if (kr != KERN_SUCCESS) break;
                  if (info.is_submap) { depth++; continue; }
                  if (info.protection & VM_PROT_READ && info.protection & VM_PROT_EXECUTE) {
                      return (uint64_t)addr;
                  }
                  addr += size;
              }
              return 0;
          }

          // ============================================================
          // JS 桥接类
          // ============================================================
          @interface KFDBridge : NSObject
          @property (nonatomic, assign) uint64_t currentBase;
          @property (nonatomic, assign) int currentPid;
          @end

          @implementation KFDBridge

          - (NSNumber *)getBaseByPid:(int)pid {
              uint64_t base = get_base_by_pid(pid);
              if (base == 0) return @0;
              self.currentPid = pid;
              self.currentBase = base;
              return @(base);
          }

          - (NSNumber *)getPidByName:(NSString *)name {
              int pid = 0;
              NSArray *list = get_process_list();
              for (NSDictionary *proc in list) {
                  if ([proc[@"name"] isEqualToString:name]) {
                      pid = [proc[@"pid"] intValue];
                      break;
                  }
              }
              return @(pid);
          }

          - (NSNumber *)read64:(NSNumber *)addr {
              return @(kread64([addr unsignedLongLongValue]));
          }

          - (NSNumber *)read32:(NSNumber *)addr {
              return @(kread32([addr unsignedLongLongValue]));
          }

          - (void)write32:(NSNumber *)addr value:(NSNumber *)value {
              kwrite32([addr unsignedLongLongValue], [value unsignedIntValue]);
          }

          - (void)writeFloat:(NSNumber *)addr value:(NSNumber *)value {
              kwrite_float([addr unsignedLongLongValue], [value floatValue]);
          }

          - (NSNumber *)getBase {
              return @(self.currentBase);
          }

          - (NSNumber *)getPid {
              return @(self.currentPid);
          }

          // 指针链解析（传入偏移数组）
          - (NSNumber *)resolveChain:(NSArray *)offsets {
              if (self.currentBase == 0) return @0;
              uint64_t addr = self.currentBase;
              for (NSNumber *off in offsets) {
                  uint64_t offset = [off unsignedLongLongValue];
                  addr = addr + offset;
                  if (off != offsets.lastObject) {
                      uint64_t v = kread64(addr);
                      if (v == 0) return @0;
                      addr = v;
                  }
              }
              return @(addr);
          }

          @end

          // ============================================================
          // AppDelegate + WebView
          // ============================================================
          @interface AppDelegate : UIResponder <UIApplicationDelegate, WKScriptMessageHandler>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) WKWebView *webView;
          @property (strong, nonatomic) KFDBridge *bridge;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];

              self.bridge = [[KFDBridge alloc] init];

              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              WKUserContentController *controller = [[WKUserContentController alloc] init];
              [controller addScriptMessageHandler:self name:@"kfdBridge"];
              config.userContentController = controller;

              self.webView = [[WKWebView alloc] initWithFrame:self.window.bounds configuration:config];
              self.webView.backgroundColor = [UIColor colorWithRed:0.04 green:0.04 blue:0.10 alpha:1.0];

              // 加载本地 HTML
              NSURL *htmlURL = [[NSBundle mainBundle] URLForResource:@"index" withExtension:@"html"];
              if (htmlURL) {
                  [self.webView loadFileURL:htmlURL allowingReadAccessToURL:[htmlURL URLByDeletingLastPathComponent]];
              } else {
                  // 降级方案（如果找不到文件，加载空页面）
                  [self.webView loadHTMLString:@"<body style='background:#0a0a1a;color:#00ffcc;padding:20px;'>⚠️ 找不到 index.html</body>" baseURL:nil];
              }

              self.window.rootViewController = [[UIViewController alloc] init];
              [self.window.rootViewController.view addSubview:self.webView];
              [self.window makeKeyAndVisible];

              return YES;
          }

          // ============================================================
          // JS 消息处理
          // ============================================================
          - (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              if (![message.name isEqualToString:@"kfdBridge"]) return;
              NSDictionary *dict = message.body;
              NSString *method = dict[@"method"];
              NSArray *args = dict[@"args"];

              id result = nil;
              SEL selector = NSSelectorFromString([NSString stringWithFormat:@"%@:", method]);

              if ([self.bridge respondsToSelector:selector]) {
                  NSMethodSignature *sig = [self.bridge methodSignatureForSelector:selector];
                  NSInvocation *inv = [NSInvocation invocationWithMethodSignature:sig];
                  [inv setTarget:self.bridge];
                  [inv setSelector:selector];
                  if (args.count > 0) {
                      id arg = args[0];
                      [inv setArgument:&arg atIndex:2];
                  }
                  [inv invoke];
                  if (sig.methodReturnLength > 0) {
                      void *ret;
                      [inv getReturnValue:&ret];
                      if (ret) {
                          result = (__bridge id)ret;
                      }
                  }
              } else {
                  SEL sel0 = NSSelectorFromString(method);
                  if ([self.bridge respondsToSelector:sel0]) {
                      #pragma clang diagnostic push
                      #pragma clang diagnostic ignored "-Warc-performSelector-leaks"
                      result = [self.bridge performSelector:sel0];
                      #pragma clang diagnostic pop
                  }
              }

              if (result) {
                  NSString *js = [NSString stringWithFormat:@"window.receiveBridgeResult(%@);", result];
                  [self.webView evaluateJavaScript:js completionHandler:nil];
              }
          }

          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          MAIN

          # 将 index.html 复制到 Payload 目录（最终会随 App 打包）
          cp index.html Payload/KFD_H5_Loader.app/

          # 编译
          clang -o Payload/KFD_H5_Loader.app/KFD_H5_Loader \
              -framework UIKit \
              -framework Foundation \
              -framework WebKit \
              -ObjC \
              -x objective-c \
              -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -target arm64-apple-ios15.0 \
              -fobjc-arc \
              main.m

          # 打包 IPA
          zip -r KFD_H5_Loader.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KFD_H5_Loader_IPA
          path: KFD_H5_Loader.ipa
