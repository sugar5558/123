name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          mkdir -p Payload/KFD_CF_Mod.app

          cat > Payload/KFD_CF_Mod.app/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>KFD_CF_Mod</string>
              <key>CFBundleIdentifier</key>
              <string>com.kfd.cfmod</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>KFD_CF_Mod</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > main.m <<SOURCE
          #import <UIKit/UIKit.h>
          #import <mach/mach.h>
          #import <mach/vm_map.h>

          // ============================================================
          // KFD 内核读写
          // ============================================================
          static mach_port_t tfp0 = MACH_PORT_NULL;

          __attribute__((constructor)) static void init_kfd() {
              task_for_pid(mach_task_self(), 0, &tfp0);
          }

          static uint64_t kfd_read64(uint64_t addr) {
              if (tfp0 == MACH_PORT_NULL) return 0;
              uint64_t v = 0;
              vm_read_overwrite(tfp0, addr, 8, (vm_address_t)&v, NULL);
              return v;
          }

          static void kfd_write32(uint64_t addr, uint32_t v) {
              if (tfp0 == MACH_PORT_NULL) return;
              vm_write(tfp0, addr, (vm_address_t)&v, 4);
          }

          static void kfd_write_float(uint64_t addr, float v) {
              uint32_t val = *(uint32_t*)&v;
              kfd_write32(addr, val);
          }

          // ============================================================
          // 日志视图
          // ============================================================
          @interface LogView : UIScrollView
          @property (nonatomic, strong) UITextView *textView;
          - (void)addLog:(NSString *)msg;
          @end

          @implementation LogView
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.backgroundColor = [UIColor colorWithWhite:0.05 alpha:0.9];
                  self.layer.cornerRadius = 10;
                  self.layer.borderColor = [UIColor colorWithWhite:0.3 alpha:0.3].CGColor;
                  self.layer.borderWidth = 0.5;

                  self.textView = [[UITextView alloc] initWithFrame:CGRectMake(8, 8, frame.size.width - 16, frame.size.height - 16)];
                  self.textView.backgroundColor = [UIColor clearColor];
                  self.textView.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
                  self.textView.font = [UIFont fontWithName:@"CourierNewPSMT" size:11];
                  self.textView.editable = NO;
                  self.textView.scrollEnabled = YES;
                  self.textView.text = @"等待操作...\\n";
                  [self addSubview:self.textView];
              }
              return self;
          }

          - (void)addLog:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  NSDateFormatter *f = [[NSDateFormatter alloc] init];
                  f.dateFormat = @"HH:mm:ss";
                  NSString *time = [f stringFromDate:[NSDate date]];
                  self.textView.text = [NSString stringWithFormat:@"[%@] %@\\n%@", time, msg, self.textView.text];
                  [self.textView scrollRangeToVisible:NSMakeRange(0, 0)];
              });
          }
          @end

          // ============================================================
          // 主界面
          // ============================================================
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) LogView *logView;
          @property (strong, nonatomic) UIButton *btnLoop;
          @property (strong, nonatomic) UIButton *btn2048;
          @property (strong, nonatomic) UILabel *statusLabel;
          @property (nonatomic, assign) BOOL isLooping;
          @property (nonatomic, strong) NSTimer *timer;
          @property (nonatomic, assign) uint64_t targetAddr;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              UIViewController *vc = [[UIViewController alloc] init];

              // ---- 背景 ----
              vc.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.12 alpha:1.0];

              // ---- 标题 ----
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(20, 50, 340, 40)];
              title.text = @"Q2848456330";
              title.textColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0];
              title.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:24];
              title.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:title];

              // ---- 状态 ----
              self.statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 95, 340, 25)];
              self.statusLabel.text = @"● 状态: 就绪";
              self.statusLabel.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
              self.statusLabel.font = [UIFont fontWithName:@"CourierNewPSMT" size:14];
              self.statusLabel.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:self.statusLabel];

              // ---- 蔡徐坤按钮 ----
              self.btnLoop = [UIButton buttonWithType:UIButtonTypeSystem];
              self.btnLoop.frame = CGRectMake(20, 135, 340, 46);
              [self.btnLoop setTitle:@"◉ 蔡徐坤" forState:UIControlStateNormal];
              [self.btnLoop setTitleColor:[UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0] forState:UIControlStateNormal];
              self.btnLoop.titleLabel.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:16];
              self.btnLoop.backgroundColor = [UIColor colorWithWhite:0.15 alpha:0.8];
              self.btnLoop.layer.borderColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:0.4].CGColor;
              self.btnLoop.layer.borderWidth = 1.0;
              self.btnLoop.layer.cornerRadius = 14;
              [self.btnLoop addTarget:self action:@selector(btnLoopTap:) forControlEvents:UIControlEventTouchUpInside];
              [vc.view addSubview:self.btnLoop];

              // ---- 2048 按钮 ----
              self.btn2048 = [UIButton buttonWithType:UIButtonTypeSystem];
              self.btn2048.frame = CGRectMake(20, 191, 340, 46);
              [self.btn2048 setTitle:@"◉ 2048" forState:UIControlStateNormal];
              [self.btn2048 setTitleColor:[UIColor colorWithRed:0.4 green:1.0 blue:0.6 alpha:1.0] forState:UIControlStateNormal];
              self.btn2048.titleLabel.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:16];
              self.btn2048.backgroundColor = [UIColor colorWithWhite:0.12 alpha:0.8];
              self.btn2048.layer.borderColor = [UIColor colorWithRed:0.4 green:1.0 blue:0.6 alpha:0.3].CGColor;
              self.btn2048.layer.borderWidth = 1.0;
              self.btn2048.layer.cornerRadius = 14;
              [self.btn2048 addTarget:self action:@selector(btn2048Tap:) forControlEvents:UIControlEventTouchUpInside];
              [vc.view addSubview:self.btn2048];

              // ---- 日志 ----
              self.logView = [[LogView alloc] initWithFrame:CGRectMake(16, 250, 348, 140)];
              [vc.view addSubview:self.logView];

              // ---- 底部 ----
              UILabel *footer = [[UILabel alloc] initWithFrame:CGRectMake(20, 400, 340, 18)];
              footer.text = @"⚡ KFD 内核  |  固定基址: 0x100000000";
              footer.textColor = [UIColor colorWithWhite:0.35 alpha:0.6];
              footer.font = [UIFont fontWithName:@"CourierNewPSMT" size:10];
              footer.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:footer];

              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];

              [self.logView addLog:@"✅ 应用启动成功，KFD 已初始化"];
              [self.logView addLog:@"📌 基址: 0x100000000 (固定)"];

              return YES;
          }

          // ============================================================
          // 蔡徐坤
          // ============================================================
          - (void)btnLoopTap:(UIButton *)sender {
              if (self.isLooping) {
                  [self.timer invalidate];
                  self.timer = nil;
                  self.isLooping = NO;
                  [sender setTitle:@"◉ 蔡徐坤" forState:UIControlStateNormal];
                  [sender setTitleColor:[UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0] forState:UIControlStateNormal];
                  self.statusLabel.text = @"● 状态: 已停止";
                  self.statusLabel.textColor = [UIColor colorWithRed:1.0 green:0.6 blue:0.1 alpha:1.0];
                  [self.logView addLog:@"⏹ 循环已停止"];
                  return;
              }

              [self.logView addLog:@"🔍 开始计算指针链..."];

              // 固定基址 0x100000000
              uint64_t base = 0x100000000;
              [self.logView addLog:[NSString stringWithFormat:@"📍 基址: 0x%llX", base]];

              // cf+0xC004BD0
              uint64_t addr = base + 0xC004BD0;
              uint64_t v1 = kfd_read64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [1] 0x%llX = 0x%llX", addr, v1]];
              if (v1 == 0) { [self.logView addLog:@"❌ 指针链断裂，请检查基址是否正确"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              // +0xA0
              addr = v1 + 0xA0;
              uint64_t v2 = kfd_read64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [2] 0x%llX = 0x%llX", addr, v2]];
              if (v2 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              // +0x1B0
              addr = v2 + 0x1B0;
              uint64_t v3 = kfd_read64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [3] 0x%llX = 0x%llX", addr, v3]];
              if (v3 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              // +0x220
              addr = v3 + 0x220;
              [self.logView addLog:[NSString stringWithFormat:@"🎯 目标地址: 0x%llX", addr]];

              self.targetAddr = addr;
              self.isLooping = YES;
              [sender setTitle:@"◉ 停止修改" forState:UIControlStateNormal];
              [sender setTitleColor:[UIColor colorWithRed:1.0 green:0.3 blue:0.5 alpha:1.0] forState:UIControlStateNormal];
              self.statusLabel.text = @"● 状态: 运行中 (F32 20)";
              self.statusLabel.textColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0];
              [self.logView addLog:@"▶ 开始循环写入 F32 20"];

              self.timer = [NSTimer scheduledTimerWithTimeInterval:0.01 repeats:YES block:^(NSTimer * _Nonnull t) {
                  if (self.targetAddr != 0) {
                      kfd_write_float(self.targetAddr, 20.0);
                  }
              }];
          }

          // ============================================================
          // 2048
          // ============================================================
          - (void)btn2048Tap:(UIButton *)sender {
              [self.logView addLog:@"🔍 开始计算 2048 指针链..."];

              uint64_t base = 0x100000000;
              [self.logView addLog:[NSString stringWithFormat:@"📍 基址: 0x%llX", base]];

              // cf+0xBFFC488
              uint64_t addr = base + 0xBFFC488;
              uint64_t v1 = kfd_read64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [1] 0x%llX = 0x%llX", addr, v1]];
              if (v1 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              // +0xA0
              addr = v1 + 0xA0;
              uint64_t v2 = kfd_read64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [2] 0x%llX = 0x%llX", addr, v2]];
              if (v2 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              // +0x190
              addr = v2 + 0x190;
              uint64_t v3 = kfd_read64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [3] 0x%llX = 0x%llX", addr, v3]];
              if (v3 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              // +0x30
              addr = v3 + 0x30;
              uint64_t v4 = kfd_read64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [4] 0x%llX = 0x%llX", addr, v4]];
              if (v4 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              // +0x444
              addr = v4 + 0x444;
              [self.logView addLog:[NSString stringWithFormat:@"🎯 目标地址: 0x%llX", addr]];

              kfd_write32(addr, 108800);
              [self.logView addLog:@"✅ 2048 写入成功! (I32 108800)"];
              self.statusLabel.text = @"✓ 2048 写入成功!";
              self.statusLabel.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
          }

          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          SOURCE

          clang -o Payload/KFD_CF_Mod.app/KFD_CF_Mod \
              -framework UIKit \
              -framework Foundation \
              -ObjC \
              -x objective-c \
              -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -target arm64-apple-ios15.0 \
              -fobjc-arc \
              main.m

          zip -r KFD_CF_Mod.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KFD_CF_Mod_IPA
          path: KFD_CF_Mod.ipa
