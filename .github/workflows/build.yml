name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project KFD_CF_Mod.xcodeproj \
            -scheme KFD_CF_Mod \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath ./build/KFD_CF_Mod.xcarchive

      - name: Export IPA
        run: |
          mkdir -p Payload
          cp -r build/KFD_CF_Mod.xcarchive/Products/Applications/KFD_CF_Mod.app Payload/
          zip -r KFD_CF_Mod.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KFD_CF_Mod_IPA
          path: KFD_CF_Mod.ipa
