name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          # 创建 App 目录
          mkdir -p Payload/KFD_CF_Mod.app

          # 创建 Info.plist
          cat > Payload/KFD_CF_Mod.app/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>KFD_CF_Mod</string>
              <key>CFBundleIdentifier</key>
              <string>com.kfd.cfmod</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>KFD_CF_Mod</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLIST

          # 写入源代码
          cat > main.m <<SOURCE
          #import <UIKit/UIKit.h>
          #import <mach/mach.h>
          #import <mach/vm_map.h>

          // ===== KFD 内核读写函数 =====
          static mach_port_t tfp0 = MACH_PORT_NULL;

          __attribute__((constructor)) static void init_kfd() {
              task_for_pid(mach_task_self(), 0, &tfp0);
          }

          static uint64_t kfd_read64(uint64_t addr) {
              if (tfp0 == MACH_PORT_NULL) return 0;
              uint64_t v = 0;
              vm_read_overwrite(tfp0, addr, 8, (vm_address_t)&v, NULL);
              return v;
          }

          static void kfd_write32(uint64_t addr, uint32_t v) {
              if (tfp0 == MACH_PORT_NULL) return;
              vm_write(tfp0, addr, (vm_address_t)&v, 4);
          }

          static void kfd_write_float(uint64_t addr, float v) {
              uint32_t val = *(uint32_t*)&v;
              kfd_write32(addr, val);
          }

          // ===== UI =====
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              UIViewController *vc = [[UIViewController alloc] init];

              // --- 背景 ---
              UIView *bg = [[UIView alloc] initWithFrame:vc.view.bounds];
              bg.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.12 alpha:1.0];
              [vc.view addSubview:bg];

              // 毛玻璃效果
              UIVisualEffectView *blur = [[UIVisualEffectView alloc] initWithEffect:[UIBlurEffect effectWithStyle:UIBlurEffectStyleDark]];
              blur.frame = CGRectMake(20, 80, 340, 280);
              blur.layer.cornerRadius = 24;
              blur.layer.masksToBounds = YES;
              blur.layer.borderColor = [UIColor colorWithWhite:0.3 alpha:0.3].CGColor;
              blur.layer.borderWidth = 0.5;
              [vc.view addSubview:blur];

              // --- 标题 ---
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(40, 110, 300, 40)];
              title.text = @"Q2848456330";
              title.textColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0];
              title.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:24];
              title.textAlignment = NSTextAlignmentCenter;
              title.shadowColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:0.3];
              title.shadowOffset = CGSizeMake(0, 0);
              [vc.view addSubview:title];

              // --- 状态 ---
              UILabel *status = [[UILabel alloc] initWithFrame:CGRectMake(40, 155, 300, 25)];
              status.text = @"● 状态: 就绪";
              status.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
              status.font = [UIFont fontWithName:@"CourierNewPSMT" size:13];
              status.textAlignment = NSTextAlignmentCenter;
              status.tag = 1;
              [vc.view addSubview:status];

              // --- 蔡徐坤按钮 ---
              UIButton *btnLoop = [UIButton buttonWithType:UIButtonTypeSystem];
              btnLoop.frame = CGRectMake(40, 195, 300, 48);
              [btnLoop setTitle:@"◉ 蔡徐坤" forState:UIControlStateNormal];
              [btnLoop setTitleColor:[UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0] forState:UIControlStateNormal];
              btnLoop.titleLabel.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:16];
              btnLoop.backgroundColor = [UIColor colorWithWhite:0.15 alpha:0.8];
              btnLoop.layer.borderColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:0.4].CGColor;
              btnLoop.layer.borderWidth = 1.0;
              btnLoop.layer.cornerRadius = 14;
              [btnLoop addTarget:self action:@selector(btnLoopTap:) forControlEvents:UIControlEventTouchUpInside];
              [vc.view addSubview:btnLoop];

              // --- 2048 按钮 ---
              UIButton *btn2048 = [UIButton buttonWithType:UIButtonTypeSystem];
              btn2048.frame = CGRectMake(40, 253, 300, 48);
              [btn2048 setTitle:@"◉ 2048" forState:UIControlStateNormal];
              [btn2048 setTitleColor:[UIColor colorWithRed:0.4 green:1.0 blue:0.6 alpha:1.0] forState:UIControlStateNormal];
              btn2048.titleLabel.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:16];
              btn2048.backgroundColor = [UIColor colorWithWhite:0.12 alpha:0.8];
              btn2048.layer.borderColor = [UIColor colorWithRed:0.4 green:1.0 blue:0.6 alpha:0.3].CGColor;
              btn2048.layer.borderWidth = 1.0;
              btn2048.layer.cornerRadius = 14;
              [btn2048 addTarget:self action:@selector(btn2048Tap:) forControlEvents:UIControlEventTouchUpInside];
              [vc.view addSubview:btn2048];

              // --- 底部信息 ---
              UILabel *footer = [[UILabel alloc] initWithFrame:CGRectMake(40, 320, 300, 18)];
              footer.text = @"⚡ KFD 内核  |  目标: CF";
              footer.textColor = [UIColor colorWithWhite:0.35 alpha:0.6];
              footer.font = [UIFont fontWithName:@"CourierNewPSMT" size:10];
              footer.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:footer];

              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }

          // ===== 蔡徐坤逻辑 =====
          - (void)btnLoopTap:(UIButton *)sender {
              UIViewController *vc = self.window.rootViewController;
              UILabel *status = (UILabel *)[vc.view viewWithTag:1];
              static BOOL isLooping = NO;
              static NSTimer *timer = nil;
              static uint64_t targetAddr = 0;

              if (isLooping) {
                  [timer invalidate];
                  timer = nil;
                  isLooping = NO;
                  [sender setTitle:@"◉ 蔡徐坤" forState:UIControlStateNormal];
                  status.text = @"● 状态: 已停止";
                  status.textColor = [UIColor colorWithRed:1.0 green:0.6 blue:0.1 alpha:1.0];
                  return;
              }

              // 原始指针链: cf+0xC004BD0+0xA0+0x1B0+0x220
              uint64_t base = 0x100000000;
              uint64_t addr = base + 0xC004BD0;
              addr = kfd_read64(addr) + 0xA0;
              addr = kfd_read64(addr) + 0x1B0;
              addr = kfd_read64(addr) + 0x220;

              if (addr == 0) {
                  status.text = @"✖ 状态: 指针断裂";
                  status.textColor = [UIColor colorWithRed:1.0 green:0.2 blue:0.2 alpha:1.0];
                  return;
              }

              targetAddr = addr;
              isLooping = YES;
              [sender setTitle:@"◉ 停止修改" forState:UIControlStateNormal];
              [sender setTitleColor:[UIColor colorWithRed:1.0 green:0.3 blue:0.5 alpha:1.0] forState:UIControlStateNormal];
              status.text = @"● 状态: 运行中 (F32 20)";
              status.textColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0];

              timer = [NSTimer scheduledTimerWithTimeInterval:0.01 repeats:YES block:^(NSTimer * _Nonnull t) {
                  if (targetAddr != 0) {
                      kfd_write_float(targetAddr, 20.0);
                  }
              }];
          }

          // ===== 2048 逻辑 =====
          - (void)btn2048Tap:(UIButton *)sender {
              UIViewController *vc = self.window.rootViewController;
              UILabel *status = (UILabel *)[vc.view viewWithTag:1];

              // 原始指针链: cf+0xBFFC488+0xA0+0x190+0x30+0x444
              uint64_t base = 0x100000000;
              uint64_t addr = base + 0xBFFC488;
              addr = kfd_read64(addr) + 0xA0;
              addr = kfd_read64(addr) + 0x190;
              addr = kfd_read64(addr) + 0x30;
              addr = kfd_read64(addr) + 0x444;

              if (addr == 0) {
                  status.text = @"✖ 状态: 指针断裂";
                  status.textColor = [UIColor colorWithRed:1.0 green:0.2 blue:0.2 alpha:1.0];
                  return;
              }

              kfd_write32(addr, 108800);
              status.text = @"✓ 状态: 2048 写入成功!";
              status.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
          }

          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          SOURCE

          # 编译
          clang -o Payload/KFD_CF_Mod.app/KFD_CF_Mod \
              -framework UIKit \
              -framework Foundation \
              -ObjC \
              -x objective-c \
              -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -target arm64-apple-ios15.0 \
              -fobjc-arc \
              main.m

          # 打包 IPA
          zip -r KFD_CF_Mod.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KFD_CF_Mod_IPA
          path: KFD_CF_Mod.ipa
