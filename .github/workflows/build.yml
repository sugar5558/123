name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          mkdir -p Payload/KFD_CF_Mod.app

          cat > Payload/KFD_CF_Mod.app/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>KFD_CF_Mod</string>
              <key>CFBundleIdentifier</key>
              <string>com.kfd.cfmod</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>KFD_CF_Mod</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > main.m <<SOURCE
          #import <UIKit/UIKit.h>
          #import <mach/mach.h>
          #import <mach/vm_map.h>
          #import <sys/sysctl.h>
          #import <mach-o/dyld.h>

          // ============================================================
          // KFD 内核级跨进程读写（绕过权限）
          // ============================================================

          // KFD 句柄（内核任务端口）
          static mach_port_t tfp0 = MACH_PORT_NULL;

          // ============================================================
          // 获取 tfp0（内核任务端口）
          // ============================================================
          static mach_port_t get_tfp0() {
              if (tfp0 != MACH_PORT_NULL) return tfp0;
              task_for_pid(mach_task_self(), 0, &tfp0);
              return tfp0;
          }

          // ============================================================
          // 内核读写（通过 tfp0）
          // ============================================================
          static uint64_t kread64(uint64_t addr) {
              mach_port_t port = get_tfp0();
              if (port == MACH_PORT_NULL) return 0;
              uint64_t v = 0;
              vm_read_overwrite(port, addr, 8, (vm_address_t)&v, NULL);
              return v;
          }

          static void kwrite64(uint64_t addr, uint64_t v) {
              mach_port_t port = get_tfp0();
              if (port == MACH_PORT_NULL) return;
              vm_write(port, addr, (vm_address_t)&v, 8);
          }

          static void kwrite32(uint64_t addr, uint32_t v) {
              mach_port_t port = get_tfp0();
              if (port == MACH_PORT_NULL) return;
              vm_write(port, addr, (vm_address_t)&v, 4);
          }

          static void kwrite_float(uint64_t addr, float v) {
              uint32_t val = *(uint32_t*)&v;
              kwrite32(addr, val);
          }

          // ============================================================
          // 通过 KFD 获取进程列表（读取内核进程链表）
          // ============================================================
          static NSArray<NSDictionary *> *get_processes_via_kfd() {
              NSMutableArray *list = [NSMutableArray array];

              // 方法1: 尝试使用 sysctl（如果有权限）
              int mib[4] = {CTL_KERN, KERN_PROC, KERN_PROC_ALL, 0};
              size_t size = 0;
              sysctl(mib, 3, NULL, &size, NULL, 0);
              if (size > 0) {
                  struct kinfo_proc *procs = malloc(size);
                  if (procs) {
                      sysctl(mib, 3, procs, &size, NULL, 0);
                      for (int i = 0; i < size / sizeof(struct kinfo_proc); i++) {
                          char *name = procs[i].kp_proc.p_comm;
                          int pid = procs[i].kp_proc.p_pid;
                          if (pid == 0 || pid == getpid()) continue;
                          if (strlen(name) > 0) {
                              [list addObject:@{
                                  @"name": [NSString stringWithUTF8String:name],
                                  @"pid": @(pid)
                              }];
                          }
                      }
                      free(procs);
                  }
              }

              // 方法2: 如果 sysctl 没取到，尝试通过 dyld 镜像列表
              if (list.count == 0) {
                  uint32_t count = _dyld_image_count();
                  for (uint32_t i = 0; i < count; i++) {
                      const char *name = _dyld_get_image_name(i);
                      if (name) {
                          NSString *procName = [[NSString stringWithUTF8String:name] lastPathComponent];
                          if (procName.length > 0) {
                              [list addObject:@{
                                  @"name": procName,
                                  @"pid": @(-1) // 未知 PID
                              }];
                          }
                      }
                  }
              }

              // 按名称排序
              [list sortUsingComparator:^NSComparisonResult(NSDictionary *a, NSDictionary *b) {
                  return [a[@"name"] compare:b[@"name"]];
              }];

              return list;
          }

          // ============================================================
          // 通过 PID 获取进程基址
          // ============================================================
          static uint64_t get_base_by_pid(int pid) {
              task_t task;
              kern_return_t kr = task_for_pid(mach_task_self(), pid, &task);
              if (kr != KERN_SUCCESS || task == MACH_PORT_NULL) {
                  return 0;
              }

              struct vm_region_submap_info_64 info;
              mach_msg_type_number_t count = VM_REGION_SUBMAP_INFO_COUNT_64;
              vm_address_t addr = 0;
              vm_size_t size = 0;
              natural_t depth = 0;

              while (1) {
                  kr = vm_region_recurse_64(task, &addr, &size, &depth, (vm_region_info_64_t)&info, &count);
                  if (kr != KERN_SUCCESS) break;
                  if (info.is_submap) { depth++; continue; }
                  if (info.protection & VM_PROT_READ && info.protection & VM_PROT_EXECUTE) {
                      return (uint64_t)addr;
                  }
                  addr += size;
              }
              return 0;
          }

          // ============================================================
          // 日志视图
          // ============================================================
          @interface LogView : UIScrollView
          @property (nonatomic, strong) UITextView *textView;
          - (void)addLog:(NSString *)msg;
          @end

          @implementation LogView
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.backgroundColor = [UIColor colorWithWhite:0.08 alpha:0.9];
                  self.layer.cornerRadius = 14;
                  self.layer.borderColor = [UIColor colorWithWhite:0.25 alpha:0.3].CGColor;
                  self.layer.borderWidth = 0.5;

                  self.textView = [[UITextView alloc] initWithFrame:CGRectMake(10, 10, frame.size.width - 20, frame.size.height - 20)];
                  self.textView.backgroundColor = [UIColor clearColor];
                  self.textView.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
                  self.textView.font = [UIFont fontWithName:@"CourierNewPSMT" size:11];
                  self.textView.editable = NO;
                  self.textView.scrollEnabled = YES;
                  self.textView.text = @"等待操作...\\n";
                  [self addSubview:self.textView];
              }
              return self;
          }

          - (void)addLog:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  NSDateFormatter *f = [[NSDateFormatter alloc] init];
                  f.dateFormat = @"HH:mm:ss";
                  NSString *time = [f stringFromDate:[NSDate date]];
                  self.textView.text = [NSString stringWithFormat:@"[%@] %@\\n%@", time, msg, self.textView.text];
                  [self.textView scrollRangeToVisible:NSMakeRange(0, 0)];
              });
          }
          @end

          // ============================================================
          // 进程选择器
          // ============================================================
          @interface ProcessPicker : UITableViewController
          @property (nonatomic, copy) void (^onSelect)(NSString *name, int pid);
          @property (nonatomic, strong) NSArray *processes;
          @end

          @implementation ProcessPicker

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"选择进程 (KFD)";
              self.tableView.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.12 alpha:1.0];
              self.tableView.separatorColor = [UIColor colorWithWhite:0.2 alpha:0.5];
              [self refreshProcesses];

              UIBarButtonItem *refreshBtn = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemRefresh target:self action:@selector(refreshProcesses)];
              self.navigationItem.rightBarButtonItem = refreshBtn;

              UIBarButtonItem *cancelBtn = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemCancel target:self action:@selector(cancel)];
              self.navigationItem.leftBarButtonItem = cancelBtn;
          }

          - (void)refreshProcesses {
              self.processes = get_processes_via_kfd();
              [self.tableView reloadData];
          }

          - (void)cancel {
              [self dismissViewControllerAnimated:YES completion:nil];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.processes.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"cell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"cell"];
                  cell.backgroundColor = [UIColor colorWithWhite:0.1 alpha:1];
                  cell.textLabel.textColor = [UIColor whiteColor];
                  cell.detailTextLabel.textColor = [UIColor colorWithWhite:0.5 alpha:1];
                  cell.textLabel.font = [UIFont fontWithName:@"CourierNewPSMT" size:14];
              }
              NSDictionary *proc = self.processes[indexPath.row];
              cell.textLabel.text = proc[@"name"];
              int pid = [proc[@"pid"] intValue];
              if (pid > 0) {
                  cell.detailTextLabel.text = [NSString stringWithFormat:@"PID: %d", pid];
              } else {
                  cell.detailTextLabel.text = @"PID: 未知";
              }
              return cell;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              NSDictionary *proc = self.processes[indexPath.row];
              if (self.onSelect) {
                  self.onSelect(proc[@"name"], [proc[@"pid"] intValue]);
              }
              [self dismissViewControllerAnimated:YES completion:nil];
          }

          @end

          // ============================================================
          // 主界面
          // ============================================================
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) LogView *logView;
          @property (strong, nonatomic) UIButton *btnSelect;
          @property (strong, nonatomic) UIButton *btnLoop;
          @property (strong, nonatomic) UIButton *btn2048;
          @property (strong, nonatomic) UILabel *statusLabel;
          @property (strong, nonatomic) UILabel *targetLabel;
          @property (nonatomic, assign) BOOL isLooping;
          @property (nonatomic, strong) NSTimer *timer;
          @property (nonatomic, assign) uint64_t targetAddr;
          @property (nonatomic, assign) uint64_t process_base;
          @property (nonatomic, assign) int selectedPid;
          @property (nonatomic, strong) NSString *selectedName;
          @property (nonatomic, assign) BOOL baseReady;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              UIViewController *vc = [[UIViewController alloc] init];

              vc.view.backgroundColor = [UIColor colorWithRed:0.04 green:0.04 blue:0.10 alpha:1.0];

              // ---- 标题 ----
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(0, 48, self.window.bounds.size.width, 44)];
              title.text = @"Q2848456330";
              title.textColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0];
              title.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:26];
              title.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:title];

              // ---- 目标 ----
              self.targetLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 98, self.window.bounds.size.width - 40, 22)];
              self.targetLabel.text = @"🎯 目标: 未选择";
              self.targetLabel.textColor = [UIColor colorWithWhite:0.5 alpha:0.8];
              self.targetLabel.font = [UIFont fontWithName:@"CourierNewPSMT" size:13];
              self.targetLabel.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:self.targetLabel];

              // ---- 状态 ----
              self.statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 124, self.window.bounds.size.width - 40, 24)];
              self.statusLabel.text = @"● 状态: 请选择进程";
              self.statusLabel.textColor = [UIColor colorWithRed:1.0 green:0.8 blue:0.1 alpha:1.0];
              self.statusLabel.font = [UIFont fontWithName:@"CourierNewPSMT" size:14];
              self.statusLabel.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:self.statusLabel];

              // ---- 选择进程 ----
              CGFloat btnWidth = self.window.bounds.size.width - 48;
              self.btnSelect = [UIButton buttonWithType:UIButtonTypeSystem];
              self.btnSelect.frame = CGRectMake((self.window.bounds.size.width - btnWidth) / 2, 165, btnWidth, 48);
              [self.btnSelect setTitle:@"📋 选择进程 (KFD)" forState:UIControlStateNormal];
              [self.btnSelect setTitleColor:[UIColor colorWithRed:0.6 green:0.8 blue:1.0 alpha:1.0] forState:UIControlStateNormal];
              self.btnSelect.titleLabel.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:16];
              self.btnSelect.backgroundColor = [UIColor colorWithWhite:0.12 alpha:0.9];
              self.btnSelect.layer.borderColor = [UIColor colorWithWhite:0.3 alpha:0.3].CGColor;
              self.btnSelect.layer.borderWidth = 1.0;
              self.btnSelect.layer.cornerRadius = 14;
              [self.btnSelect addTarget:self action:@selector(selectProcess) forControlEvents:UIControlEventTouchUpInside];
              [vc.view addSubview:self.btnSelect];

              // ---- 蔡徐坤 ----
              self.btnLoop = [UIButton buttonWithType:UIButtonTypeSystem];
              self.btnLoop.frame = CGRectMake((self.window.bounds.size.width - btnWidth) / 2, 223, btnWidth, 48);
              [self.btnLoop setTitle:@"◉ 蔡徐坤" forState:UIControlStateNormal];
              [self.btnLoop setTitleColor:[UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0] forState:UIControlStateNormal];
              self.btnLoop.titleLabel.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:16];
              self.btnLoop.backgroundColor = [UIColor colorWithWhite:0.15 alpha:0.9];
              self.btnLoop.layer.borderColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:0.35].CGColor;
              self.btnLoop.layer.borderWidth = 1.0;
              self.btnLoop.layer.cornerRadius = 14;
              [self.btnLoop addTarget:self action:@selector(btnLoopTap:) forControlEvents:UIControlEventTouchUpInside];
              [vc.view addSubview:self.btnLoop];

              // ---- 2048 ----
              self.btn2048 = [UIButton buttonWithType:UIButtonTypeSystem];
              self.btn2048.frame = CGRectMake((self.window.bounds.size.width - btnWidth) / 2, 281, btnWidth, 48);
              [self.btn2048 setTitle:@"◉ 2048" forState:UIControlStateNormal];
              [self.btn2048 setTitleColor:[UIColor colorWithRed:0.4 green:1.0 blue:0.6 alpha:1.0] forState:UIControlStateNormal];
              self.btn2048.titleLabel.font = [UIFont fontWithName:@"CourierNewPS-BoldMT" size:16];
              self.btn2048.backgroundColor = [UIColor colorWithWhite:0.12 alpha:0.9];
              self.btn2048.layer.borderColor = [UIColor colorWithRed:0.4 green:1.0 blue:0.6 alpha:0.3].CGColor;
              self.btn2048.layer.borderWidth = 1.0;
              self.btn2048.layer.cornerRadius = 14;
              [self.btn2048 addTarget:self action:@selector(btn2048Tap:) forControlEvents:UIControlEventTouchUpInside];
              [vc.view addSubview:self.btn2048];

              // ---- 日志 ----
              CGFloat logWidth = self.window.bounds.size.width - 32;
              CGFloat logHeight = self.window.bounds.size.height - 420;
              if (logHeight < 80) logHeight = 80;
              if (logHeight > 140) logHeight = 140;
              self.logView = [[LogView alloc] initWithFrame:CGRectMake((self.window.bounds.size.width - logWidth) / 2, 345, logWidth, logHeight)];
              [vc.view addSubview:self.logView];

              // ---- 底部 ----
              UILabel *footer = [[UILabel alloc] initWithFrame:CGRectMake(0, self.window.bounds.size.height - 36, self.window.bounds.size.width, 20)];
              footer.text = @"⚡ KFD 内核级读写  |  选择进程后走动态指针链";
              footer.textColor = [UIColor colorWithWhite:0.2 alpha:0.6];
              footer.font = [UIFont fontWithName:@"CourierNewPSMT" size:10];
              footer.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:footer];

              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];

              [self.logView addLog:@"✅ 应用启动成功 (KFD 内核级)"];
              [self.logView addLog:@"📌 点击「选择进程 (KFD)」选择目标"];

              // 检查 tfp0
              mach_port_t port = get_tfp0();
              if (port == MACH_PORT_NULL) {
                  [self.logView addLog:@"⚠️ tfp0 获取失败，请确保在越狱环境下运行"];
                  [self.logView addLog:@"💡 如果使用 TrollStore，请用 TrollStore 安装此 IPA"];
              } else {
                  [self.logView addLog:@"✅ tfp0 获取成功"];
              }

              return YES;
          }

          // ============================================================
          // 选择进程
          // ============================================================
          - (void)selectProcess {
              ProcessPicker *picker = [[ProcessPicker alloc] init];
              picker.onSelect = ^(NSString *name, int pid) {
                  if (pid <= 0) {
                      [self.logView addLog:[NSString stringWithFormat:@"⚠️ %@ 没有有效 PID，请手动输入", name]];
                      [self showManualInput:name];
                      return;
                  }

                  [self.logView addLog:[NSString stringWithFormat:@"🎯 选择了 %@ (PID: %d)", name, pid]];
                  [self setupTarget:name pid:pid];
              };

              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:picker];
              nav.navigationBar.barStyle = UIBarStyleBlack;
              nav.navigationBar.tintColor = [UIColor cyanColor];
              [self.window.rootViewController presentViewController:nav animated:YES completion:nil];
          }

          // ============================================================
          // 手动输入 PID
          // ============================================================
          - (void)showManualInput:(NSString *)name {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"输入 PID" message:[NSString stringWithFormat:@"请输入 %@ 的进程号", name] preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *textField) {
                  textField.placeholder = @"例如: 2480";
                  textField.keyboardType = UIKeyboardTypeNumberPad;
              }];
              [alert addAction:[UIAlertAction actionWithTitle:@"确定" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *pidText = alert.textFields.firstObject.text;
                  int pid = [pidText intValue];
                  if (pid > 0) {
                      [self setupTarget:name pid:pid];
                  } else {
                      [self.logView addLog:@"❌ 无效的 PID"];
                  }
              }]];
              [alert addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
              [self.window.rootViewController presentViewController:alert animated:YES completion:nil];
          }

          // ============================================================
          // 设置目标进程
          // ============================================================
          - (void)setupTarget:(NSString *)name pid:(int)pid {
              self.selectedName = name;
              self.selectedPid = pid;
              self.targetLabel.text = [NSString stringWithFormat:@"🎯 目标: %@ (PID: %d)", name, pid];

              uint64_t base = get_base_by_pid(pid);
              if (base == 0) {
                  [self.logView addLog:@"❌ 获取基址失败"];
                  self.statusLabel.text = @"✖ 基址获取失败";
                  self.statusLabel.textColor = [UIColor colorWithRed:1.0 green:0.2 blue:0.2 alpha:1.0];
                  self.baseReady = NO;
                  return;
              }

              self.process_base = base;
              self.baseReady = YES;
              [self.logView addLog:[NSString stringWithFormat:@"✅ 基址: 0x%llX", base]];
              self.statusLabel.text = @"● 状态: 就绪";
              self.statusLabel.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
          }

          // ============================================================
          // 蔡徐坤
          // ============================================================
          - (void)btnLoopTap:(UIButton *)sender {
              if (!self.baseReady) {
                  [self.logView addLog:@"⚠️ 请先选择进程"];
                  self.statusLabel.text = @"✖ 请先选择进程";
                  self.statusLabel.textColor = [UIColor colorWithRed:1.0 green:0.2 blue:0.2 alpha:1.0];
                  return;
              }

              if (self.isLooping) {
                  [self.timer invalidate];
                  self.timer = nil;
                  self.isLooping = NO;
                  [sender setTitle:@"◉ 蔡徐坤" forState:UIControlStateNormal];
                  [sender setTitleColor:[UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0] forState:UIControlStateNormal];
                  self.statusLabel.text = @"● 状态: 已停止";
                  self.statusLabel.textColor = [UIColor colorWithRed:1.0 green:0.6 blue:0.1 alpha:1.0];
                  [self.logView addLog:@"⏹ 循环已停止"];
                  return;
              }

              [self.logView addLog:@"🔍 开始计算指针链..."];
              [self.logView addLog:[NSString stringWithFormat:@"📍 基址: 0x%llX", self.process_base]];

              uint64_t addr = self.process_base + 0xC004BD0;
              uint64_t v1 = kread64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [1] 0x%llX = 0x%llX", addr, v1]];
              if (v1 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              addr = v1 + 0xA0;
              uint64_t v2 = kread64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [2] 0x%llX = 0x%llX", addr, v2]];
              if (v2 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              addr = v2 + 0x1B0;
              uint64_t v3 = kread64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [3] 0x%llX = 0x%llX", addr, v3]];
              if (v3 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              addr = v3 + 0x220;
              [self.logView addLog:[NSString stringWithFormat:@"🎯 目标地址: 0x%llX", addr]];

              self.targetAddr = addr;
              self.isLooping = YES;
              [sender setTitle:@"◉ 停止修改" forState:UIControlStateNormal];
              [sender setTitleColor:[UIColor colorWithRed:1.0 green:0.3 blue:0.5 alpha:1.0] forState:UIControlStateNormal];
              self.statusLabel.text = @"● 状态: 运行中 (F32 20)";
              self.statusLabel.textColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0];
              [self.logView addLog:@"▶ 开始循环写入 F32 20"];

              self.timer = [NSTimer scheduledTimerWithTimeInterval:0.01 repeats:YES block:^(NSTimer * _Nonnull t) {
                  if (self.targetAddr != 0) {
                      kwrite_float(self.targetAddr, 20.0);
                  }
              }];
          }

          // ============================================================
          // 2048
          // ============================================================
          - (void)btn2048Tap:(UIButton *)sender {
              if (!self.baseReady) {
                  [self.logView addLog:@"⚠️ 请先选择进程"];
                  self.statusLabel.text = @"✖ 请先选择进程";
                  self.statusLabel.textColor = [UIColor colorWithRed:1.0 green:0.2 blue:0.2 alpha:1.0];
                  return;
              }

              [self.logView addLog:@"🔍 开始计算 2048 指针链..."];
              [self.logView addLog:[NSString stringWithFormat:@"📍 基址: 0x%llX", self.process_base]];

              uint64_t addr = self.process_base + 0xBB8FAC8;
              uint64_t v1 = kread64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [1] 0x%llX = 0x%llX", addr, v1]];
              if (v1 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              addr = v1 + 0x38;
              uint64_t v2 = kread64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [2] 0x%llX = 0x%llX", addr, v2]];
              if (v2 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              addr = v2 + 0x8;
              uint64_t v3 = kread64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [3] 0x%llX = 0x%llX", addr, v3]];
              if (v3 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              addr = v3 + 0x0;
              uint64_t v4 = kread64(addr);
              [self.logView addLog:[NSString stringWithFormat:@"📖 [4] 0x%llX = 0x%llX", addr, v4]];
              if (v4 == 0) { [self.logView addLog:@"❌ 指针链断裂"]; self.statusLabel.text = @"✖ 指针断裂"; return; }

              addr = v4 + 0x444;
              [self.logView addLog:[NSString stringWithFormat:@"🎯 目标地址: 0x%llX", addr]];

              kwrite32(addr, 108800);
              [self.logView addLog:@"✅ 2048 写入成功! (I32 108800)"];
              self.statusLabel.text = @"✓ 2048 写入成功!";
              self.statusLabel.textColor = [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1.0];
          }

          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
